CMDSCRIPT /usr/local/bin/nut-orchestrator.sh
PIPEFN /run/nut/upssched/upssched.pipe
LOCKFN /run/nut/upssched/upssched.lock

# ups7 - 4 minute cancelable countdown
AT ONBATT ups7@localhost EXECUTE ups7-onbatt
AT ONBATT ups7@localhost START-TIMER ups7-commit 240
AT ONLINE ups7@localhost CANCEL-TIMER ups7-commit ups7-online

# ups2 - 7 minute cancelable countdown
AT ONBATT ups2@localhost EXECUTE ups2-onbatt
AT ONBATT ups2@localhost START-TIMER ups2-commit 420
AT ONLINE ups2@localhost CANCEL-TIMER ups2-commit ups2-online

# ups8 - framework only, 3 minute cancelable countdown
AT ONBATT ups8@localhost EXECUTE ups8-onbatt
AT ONBATT ups8@localhost START-TIMER ups8-commit 180
AT ONLINE ups8@localhost CANCEL-TIMER ups8-commit ups8-online

# ups6 - 5 minute cancelable countdown
AT ONBATT ups6@localhost EXECUTE ups6-onbatt
AT ONBATT ups6@localhost START-TIMER ups6-commit 300
AT ONLINE ups6@localhost CANCEL-TIMER ups6-commit ups6-online

# ups9 - 6 minute cancelable countdown
AT ONBATT ups9@localhost EXECUTE ups9-onbatt
AT ONBATT ups9@localhost START-TIMER ups9-commit 360
AT ONLINE ups9@localhost CANCEL-TIMER ups9-commit ups9-online


# ups3 - Phase 2 UPS-specific validation target
AT ONBATT ups3@localhost EXECUTE ups3-onbatt
AT ONBATT ups3@localhost START-TIMER ups3-commit 300
AT ONLINE ups3@localhost CANCEL-TIMER ups3-commit phase2-power-restore-abort-ups3
