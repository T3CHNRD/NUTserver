# NUT Email Alert Settings
# Managed by NUT server project.
# Editable from NUT UI / Editable Live Config.
#
# IMPORTANT PASSWORD BEHAVIOR:
# - The real SMTP password/app password is stored directly in this file by request.
# - Anyone who can read this file or open this item in Editable Live Config can see the password.
#
# Mode email rules:
# - OFF: no emails are sent.
# - STANDBY: power event emails and weekly UPS health email only.
# - PROTECTING: all configured email alerts are sent.

NUT_EMAIL_ENABLED="1"

# Email Account Settings
SMTP_SERVER="smtp.office365.com"
SERVER_PORT="587"
AUTHENTICATION_REQUIRED="Yes"
USER_NAME="tvedders@aluminumblanking.com"
SMTP_PASSWORD="REDACTED"
SSL_STATE="STARTTLS"

# Email Recipients
EMAIL_RECIPIENTS="tvedders@albl.com"

# Sender / subject settings
EMAIL_FROM="tvedders@aluminumblanking.com"
EMAIL_SUBJECT_PREFIX="[NUT Server Test]"

# OFF mode:
# OFF means everything is off, including monitoring/logging behavior as defined by the mode system.
# Email rule: no emails will be sent.
OFF_EMAILS_ENABLED="0"

# STANDBY mode:
# Monitoring is active, live shutdown/protection actions are blocked.
# Email rule: only power events and weekly UPS health emails are allowed.
STANDBY_POWER_EVENTS="1"
STANDBY_UPS_HEALTH="1"
STANDBY_SHUTDOWN_EVENTS="0"
STANDBY_FINAL_SHUTDOWN="0"

# PROTECTING mode:
# Monitoring is active, live protection actions are allowed for qualifying UPS events.
# Email rule: all configured alerts are allowed.
PROTECT_POWER_EVENTS="1"
PROTECT_UPS_HEALTH="1"
PROTECT_SHUTDOWN_EVENTS="1"
PROTECT_FINAL_SHUTDOWN="1"

# Alert switches
ALERT_POWER_TO_UPS="1"
ALERT_POWER_TO_GRID="1"
ALERT_SHUTDOWN_STARTED="1"
ALERT_SHUTDOWN_CANCELED="1"
ALERT_NUTSERVER_FINAL_SHUTDOWN="1"
ALERT_WEEKLY_UPS_HEALTH="1"
