# NUT hypervisor SSH fallback configuration.
# Prepared for ESXi now and Proxmox later.
# This file is intentionally execution-disabled until SSH is approved, enabled, trusted, and read-only tested.

HYPERVISOR_SSH_FALLBACK_CONFIGURED=1
HYPERVISOR_SSH_FALLBACK_ENABLED=1

# Primary VMware path remains vCenter API.
VMWARE_PRIMARY_HOST_SHUTDOWN_METHOD="vcenter_api"

# SSH fallback can be used later only if enabled and tested.
VMWARE_FALLBACK_HOST_SHUTDOWN_METHOD="esxi_ssh"
PROXMOX_FALLBACK_HOST_SHUTDOWN_METHOD="proxmox_ssh"

HYPERVISOR_SSH_KEY="/root/.ssh/nut_hypervisor_shutdown_rsa"

# -----------------------------
# ESXi current known data
# -----------------------------
ESXI_SSH_USER="root"

# vCenter reports these names, but NUT server DNS currently does not resolve them.
ESXI_HOST_01_NAME="alblvmhost01.albl.com"
ESXI_HOST_02_NAME="alblvmhost02.albl.com"
ESXI_HOST_03_NAME="alblvmhost03.albl.com"

# Legacy target IPs exist, but exact hostname-to-IP mapping still needs confirmation.
# Keep these as candidate IPs until mapped and tested.
ESXI_CANDIDATE_IP_1="192.168.99.70"
ESXI_CANDIDATE_IP_2="192.168.99.71"
ESXI_CANDIDATE_IP_3="192.168.99.72"

ESXI_HOST_01_IP="192.168.99.70"
ESXI_HOST_02_IP="192.168.99.71"
ESXI_HOST_03_IP="192.168.99.72"

ESXI_SHUTDOWN_REASON="power outage"
ESXI_SHUTDOWN_DELAY_SECONDS=60

# Future ESXi live gate requirements:
#   HYPERVISOR_SSH_FALLBACK_ENABLED=0
#   ALLOW_REAL_TEST=1
#   REAL_TEST_PHASE=phase3-full
#   VMWARE_HOST_ACTION_APPROVED=1
#   CONFIRM_POWER_OUTAGE_HOST_SHUTDOWN="power outage"

# -----------------------------
# Proxmox future migration wiring
# -----------------------------
PROXMOX_SSH_USER="root"

# Fill these in only if/when Proxmox hosts exist.
PROXMOX_HOST_01_NAME="UNKNOWN"
PROXMOX_HOST_01_IP="UNKNOWN"

PROXMOX_HOST_02_NAME="UNKNOWN"
PROXMOX_HOST_02_IP="UNKNOWN"

PROXMOX_HOST_03_NAME="UNKNOWN"
PROXMOX_HOST_03_IP="UNKNOWN"

PROXMOX_SHUTDOWN_REASON="power outage"

# Future Proxmox live gate requirements:
#   HYPERVISOR_SSH_FALLBACK_ENABLED=0
#   ALLOW_REAL_TEST=1
#   REAL_TEST_PHASE=phase3-full
#   PROXMOX_HOST_ACTION_APPROVED=1
#   CONFIRM_POWER_OUTAGE_HOST_SHUTDOWN="power outage"

# Safety note:
# This config prepares wiring only. It does not execute anything by itself.
