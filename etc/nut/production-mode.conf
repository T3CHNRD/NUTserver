# NUT production mode status/enforcement file.
# User-facing modes:
#   armed     = PROTECTING
#   disarmed  = STANDBY FOR MAINTENANCE
#   off       = OFF
#
# Current enforcement:
#   armed     = production protection posture is active
#   disarmed  = live shutdown/orchestration commit actions are blocked
#   off       = live actions blocked; monitoring/logging timers and nut-monitor.service are stopped
#
# ESXi fallback:
#   In PROTECTING mode, ESXi fallback readiness is enabled for the approved live test path.
#   This file alone does not send shutdown, poweroff, reboot, maintenance, or VM power commands.

NUT_PRODUCTION_MODE=armed
NUT_ALLOW_LIVE_ACTIONS=1
NUT_ALLOW_ESXI_SSH_FALLBACK=1
NUT_MODE_UPDATED_AT="2026-06-16T13:38:09-04:00"
NUT_MODE_UPDATED_BY="www-data"
NUT_MODE_NOTE="PROTECTING: Monitoring active. Live protection actions are allowed for qualifying UPS power events."
