# ha-production-targets.conf
# PRODUCTION ORDER DEFINITION ONLY
# DO NOT EXECUTE AGAINST LIVE SYSTEMS YET

# EXECUTION BLOCKER:
# CHANGE_ME_VCSA_LAST_HOST must be replaced with the actual ESXi host
# that normally carries the vCenter appliance during a shutdown event.
# Do not write or enable live execution logic until this is confirmed.

# Format:
# phase|type|name|method|wait_seconds|notes
#
# type:
#   vm, host, storage, nut
#
# method:
#   vcenter_vm      = clustered VM shutdown via central orchestration
#   vcenter_host    = clustered host shutdown via central orchestration
#   storage_manual  = storage handled after compute
#   local_nut       = local final NUT server action
#
# wait_seconds:
#   time to wait after completing the action before the next phase

