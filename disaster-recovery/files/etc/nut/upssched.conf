CMDSCRIPT /usr/local/bin/nut-orchestrator.sh
PIPEFN /run/nut/upssched/upssched.pipe
LOCKFN /run/nut/upssched/upssched.lock

# ups7 - 4 minute cancelable countdown
AT ONBATT ups7@localhost EXECUTE ups7-onbatt
AT ONBATT ups7@localhost START-TIMER ups7-commit 240
AT ONLINE ups7@localhost CANCEL-TIMER ups7-commit ups7-online

# ups2 - 7 minute cancelable countdown
AT ONBATT ups2@localhost EXECUTE ups2-onbatt
AT ONBATT ups2@localhost START-TIMER ups2-commit 420
AT ONLINE ups2@localhost CANCEL-TIMER ups2-commit ups2-online

# ups8 - framework only, 3 minute cancelable countdown
AT ONBATT ups8@localhost EXECUTE ups8-onbatt
AT ONBATT ups8@localhost START-TIMER ups8-commit 180
AT ONLINE ups8@localhost CANCEL-TIMER ups8-commit ups8-online

# ups6 - 5 minute cancelable countdown
AT ONBATT ups6@localhost EXECUTE ups6-onbatt
AT ONBATT ups6@localhost START-TIMER ups6-commit 300
AT ONLINE ups6@localhost CANCEL-TIMER ups6-commit ups6-online

# ups9 - 6 minute cancelable countdown
AT ONBATT ups9@localhost EXECUTE ups9-onbatt
AT ONBATT ups9@localhost START-TIMER ups9-commit 360
AT ONLINE ups9@localhost CANCEL-TIMER ups9-commit ups9-online


# ups3 - Phase 2 UPS-specific validation target
AT ONBATT ups3@localhost EXECUTE ups3-onbatt
AT ONBATT ups3@localhost START-TIMER ups3-commit 300
AT ONLINE ups3@localhost CANCEL-TIMER ups3-commit phase2-power-restore-abort-ups3

# UPS Maintenance Mode communication hooks
# These record COMMBAD/COMMOK events only. They do not suppress shutdowns yet.
AT COMMBAD ups7@localhost EXECUTE ups7-commbad
AT COMMOK ups7@localhost EXECUTE ups7-commok
AT COMMBAD ups2@localhost EXECUTE ups2-commbad
AT COMMOK ups2@localhost EXECUTE ups2-commok
AT COMMBAD ups8@localhost EXECUTE ups8-commbad
AT COMMOK ups8@localhost EXECUTE ups8-commok
AT COMMBAD ups6@localhost EXECUTE ups6-commbad
AT COMMOK ups6@localhost EXECUTE ups6-commok
AT COMMBAD ups9@localhost EXECUTE ups9-commbad
AT COMMOK ups9@localhost EXECUTE ups9-commok
AT COMMBAD ups3@localhost EXECUTE ups3-commbad
AT COMMOK ups3@localhost EXECUTE ups3-commok

# Low-battery email notification routes
AT LOWBATT ups7@localhost EXECUTE ups7-lowbatt
AT LOWBATT ups2@localhost EXECUTE ups2-lowbatt
AT LOWBATT ups8@localhost EXECUTE ups8-lowbatt
AT LOWBATT ups6@localhost EXECUTE ups6-lowbatt
AT LOWBATT ups9@localhost EXECUTE ups9-lowbatt
AT LOWBATT ups3@localhost EXECUTE ups3-lowbatt

# UPS1 / UPS4 / UPS5 - alert-only orchestration
# No shutdown countdowns or commit actions are configured.

AT ONBATT ups1@localhost EXECUTE ups1-onbatt
AT ONLINE ups1@localhost EXECUTE ups1-online
AT LOWBATT ups1@localhost EXECUTE ups1-lowbatt
AT COMMBAD ups1@localhost EXECUTE ups1-commbad
AT COMMOK ups1@localhost EXECUTE ups1-commok

AT ONBATT ups4@localhost EXECUTE ups4-onbatt
AT ONLINE ups4@localhost EXECUTE ups4-online
AT LOWBATT ups4@localhost EXECUTE ups4-lowbatt
AT COMMBAD ups4@localhost EXECUTE ups4-commbad
AT COMMOK ups4@localhost EXECUTE ups4-commok

AT ONBATT ups5@localhost EXECUTE ups5-onbatt
AT ONLINE ups5@localhost EXECUTE ups5-online
AT LOWBATT ups5@localhost EXECUTE ups5-lowbatt
AT COMMBAD ups5@localhost EXECUTE ups5-commbad
AT COMMOK ups5@localhost EXECUTE ups5-commok
