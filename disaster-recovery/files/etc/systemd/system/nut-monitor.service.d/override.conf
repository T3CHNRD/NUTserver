[Service]
# Allow the service to see and run your script
ProtectSystem=full
ReadWritePaths=/run /var/lib/nut /etc/nut
# Allow execution from /usr/local/bin
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE CAP_SYS_ADMIN
NoNewPrivileges=no
